name: validate-cert-requests

on:
  push:
    paths:
      - 'namespace-tn001/requests/certificates/**'
      - 'schemas/**'
  pull_request:
    paths:
      - 'namespace-tn001/requests/certificates/**'
      - 'schemas/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate cert request schemas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install check-jsonschema
        run: pip install check-jsonschema

      - name: Validate certificate role requests
        run: |
          shopt -s nullglob
          files=(namespace-tn001/requests/certificates/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No certificate request files found — nothing to validate."
            exit 0
          fi
          check-jsonschema --schemafile schemas/cert-role.schema.json "${files[@]}"
